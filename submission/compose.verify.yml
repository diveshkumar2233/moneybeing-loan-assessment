# Isolated verification ports; run with the root docker-compose.yml.
services:
  db:
    ports: !override ["55433:5432"]
  backend:
    ports: !override ["8003:8000"]
    environment:
      CORS_ORIGINS: '["http://localhost:3003"]'
  frontend:
    ports: !override ["3003:3000"]
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8003
