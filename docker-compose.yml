services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: moneybeing
      POSTGRES_PASSWORD: moneybeing
      POSTGRES_DB: moneybeing
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybeing -d moneybeing"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://moneybeing:moneybeing@db:5432/moneybeing
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
