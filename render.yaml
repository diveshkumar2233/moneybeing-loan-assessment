services:
  - type: web
    name: moneybeing-loan-assessment
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moneybeing-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: '[]'
      - key: MOCK_CREDIT_FAILURE
        value: 'false'

databases:
  - name: moneybeing-postgres
    plan: free
    region: singapore
    databaseName: moneybeing
    user: moneybeing
    ipAllowList: []
